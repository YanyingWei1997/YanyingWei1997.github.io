<!-- 强调色增强的JavaScript动效 -->
<script>
// 页面加载后的滚动动画
document.addEventListener('DOMContentLoaded', function() {
  // 滚动触发动画
  const observerOptions = {
    threshold: 0.1,
    rootMargin: '0px 0px -50px 0px'
  };
  
  const observer = new IntersectionObserver(function(entries) {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('animate');
      }
    });
  }, observerOptions);
  
  // 为元素添加动画类
  document.querySelectorAll('.paper-box, .publication-entry, .highlight-block').forEach(el => {
    el.classList.add('fade-in-up');
    observer.observe(el);
  });
  
  // 为重要链接添加强调色效果
  document.querySelectorAll('a[href*="pdf"], a[href*="github"], a[href*="arxiv"]').forEach(link => {
    link.classList.add('link-accent');
  });

  // 折叠较长的代表性成果列表
  document.querySelectorAll('.publications-list').forEach(list => {
    const visibleCount = Number(list.dataset.visibleCount || 4);
    const cards = Array.from(list.querySelectorAll(':scope > .paper-box, :scope > .publication-entry'));
    const filter = list.previousElementSibling && list.previousElementSibling.classList.contains('publication-filter')
      ? list.previousElementSibling
      : null;
    const filterButtons = filter ? Array.from(filter.querySelectorAll('[data-publication-filter]')) : [];

    if (!cards.length) {
      return;
    }

    const moreLabel = list.dataset.moreLabel || 'More';
    const lessLabel = list.dataset.lessLabel || 'Show Less';
    let expanded = false;
    const buttonWrap = document.createElement('div');
    const button = document.createElement('button');
    const icon = document.createElement('i');
    const label = document.createElement('span');

    buttonWrap.className = 'publications-more-wrap';
    button.className = 'publications-more-btn';
    button.type = 'button';
    button.setAttribute('aria-expanded', 'false');
    icon.className = 'fas fa-chevron-down';
    label.textContent = moreLabel;

    button.append(icon, label);
    buttonWrap.append(button);
    list.after(buttonWrap);

    const getActiveFilter = () => {
      const activeButton = filterButtons.find(item => item.classList.contains('is-active'));
      return activeButton ? activeButton.dataset.publicationFilter : 'all';
    };

    const updatePublications = () => {
      const activeFilter = getActiveFilter();
      const matchingCards = cards.filter(card => activeFilter === 'all' || card.dataset.year === activeFilter);

      cards.forEach(card => {
        const matchIndex = matchingCards.indexOf(card);
        const matchesFilter = matchIndex !== -1;
        const hiddenByLimit = matchesFilter && !expanded && matchIndex >= visibleCount;
        card.classList.toggle('publication-hidden', !matchesFilter || hiddenByLimit);
      });

      const hasOverflow = matchingCards.length > visibleCount;
      buttonWrap.style.display = hasOverflow ? 'flex' : 'none';
      button.setAttribute('aria-expanded', String(expanded && hasOverflow));
      icon.className = expanded && hasOverflow ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
      label.textContent = expanded && hasOverflow ? lessLabel : moreLabel;
    };

    filterButtons.forEach(filterButton => {
      filterButton.addEventListener('click', () => {
        filterButtons.forEach(item => item.classList.remove('is-active'));
        filterButton.classList.add('is-active');
        expanded = false;
        updatePublications();
      });
    });

    button.addEventListener('click', () => {
      expanded = !expanded;
      updatePublications();
      if (!expanded) {
        list.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    updatePublications();
  });
});

// 动态添加装饰条
document.addEventListener('DOMContentLoaded', function() {
  const body = document.body;
  body.classList.add('accent-border-top');
});
</script>
